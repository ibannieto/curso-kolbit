# Exposición opcional mediante Gateway API (sustituto de Ingress).
# Requiere un Gateway existente (p.ej. con la GatewayClass "cilium") y un hostname.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: curso-kolbit
spec:
  parentRefs:
    - name: public            # TODO: nombre del Gateway
      namespace: gateway      # TODO: namespace del Gateway
  hostnames:
    - curso.example.com       # TODO: hostname real
  rules:
    - backendRefs:
        - name: curso-kolbit
          port: 80
