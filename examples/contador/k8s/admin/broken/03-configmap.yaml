# Lab 15 · Roto nº 3 — El contenedor ni siquiera llega a crearse
#   kubectl apply -f examples/contador/k8s/admin/broken/03-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: roto-config
  namespace: contador
data:
  MENSAJE: "Hola desde un ConfigMap"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: roto-config
  namespace: contador
  labels:
    app.kubernetes.io/name: roto-config
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: roto-config
  template:
    metadata:
      labels:
        app.kubernetes.io/name: roto-config
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: contador:1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: roto-config
                  key: APP_MESSAGE
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: contador-secret
                  key: REDIS_PASSWORD
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
