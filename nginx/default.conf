# nginx para servir la presentación (imagen nginx-unprivileged, puerto 8080)
# Este fichero se incluye dentro del bloque http{} de /etc/nginx/nginx.conf.

# Caché: recursos estáticos 7 días, HTML/Markdown siempre revalidados.
# Se usa un map porque un add_header dentro de un location anula TODOS los
# add_header heredados del server (y perderíamos las cabeceras de seguridad).
map $uri $kolbit_cache_control {
    ~*\.(woff2|svg|png|jpg|webp|css|js)$  "public, max-age=604800";
    default                               "no-cache";
}

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    server_tokens off;
    charset utf-8;
    charset_types text/markdown text/css application/javascript application/json image/svg+xml;

    gzip on;
    gzip_types text/plain text/css text/markdown application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header Cache-Control $kolbit_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        try_files /healthz =404;
    }

    # Las diapositivas Markdown se cargan con fetch desde reveal.js.
    # (Un bloque "types" a nivel de server sustituiría todo mime.types.)
    location ~* \.md$ {
        types { }
        default_type text/markdown;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
