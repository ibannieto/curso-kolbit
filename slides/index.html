<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Docker &amp; Kubernetes &amp; CaaS</title>
    <meta name="description" content="Curso Docker, Kubernetes y Containers as a Service" />
    <link rel="icon" href="assets/img/logos/kubernetes.svg" type="image/svg+xml" />

    <link rel="stylesheet" href="vendor/reveal/reset.css" />
    <link rel="stylesheet" href="vendor/reveal/reveal.css" />
    <link rel="stylesheet" href="vendor/reveal/theme/black.css" />
    <link rel="stylesheet" href="vendor/reveal/plugin/highlight/monokai.css" />
    <link rel="stylesheet" href="css/kolbit.css" />
  </head>
  <body>
    <div class="reveal">
      <div class="slides">
        <!--
          Cada módulo es un fichero Markdown independiente.
          Separador de diapositiva: una línea con solo "---"
          Notas del ponente: líneas tras "Note:" (tecla S para verlas)
          La lista de módulos se genera en scripts/build.mjs a partir de slides/*.md
        -->
        <!-- @@MODULES@@ -->
      </div>
    </div>

    <script src="vendor/reveal/reveal.js"></script>
    <script src="vendor/reveal/plugin/markdown.js"></script>
    <script src="vendor/reveal/plugin/highlight.js"></script>
    <script src="vendor/reveal/plugin/notes.js"></script>
    <script src="vendor/reveal/plugin/search.js"></script>
    <script src="vendor/reveal/plugin/zoom.js"></script>
    <script>
      Reveal.initialize({
        hash: true,
        history: false,
        slideNumber: 'c/t',
        showSlideNumber: 'all',
        progress: true,
        center: false,
        transition: 'fade',
        transitionSpeed: 'fast',
        width: 1280,
        height: 720,
        margin: 0.04,
        pdfSeparateFragments: false,
        pdfMaxPagesPerSlide: 1,
        markdown: { smartypants: true },
        highlight: { beforeHighlight: (hljs) => hljs.configure({ ignoreUnescapedHTML: true }) },
        plugins: [RevealMarkdown, RevealHighlight, RevealNotes, RevealSearch, RevealZoom],
      });
    </script>
  </body>
</html>
